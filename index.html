<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>実績チェッカー</title>
<style>
:root{--bg:#f4f6f8;--panel:#fff;--text:#18202a;--muted:#6b7280;--line:#e5e7eb;--dark:#343a40;--accent:#1677ff;--green:#168a55;--red:#d84a4a}

.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.search{flex:1;min-width:180px;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:15px;background:#fff}.select,.btn{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font-weight:700}.btn{cursor:pointer}.btn.danger{color:var(--red)}
.menu-btn{min-width:72px;height:42px;padding:0 14px;font-size:14px;display:grid;place-items:center;border-radius:13px}.menu-panel{position:fixed;inset:0;background:rgba(15,23,42,.42);display:none;align-items:flex-end;justify-content:center;z-index:90;padding:12px}.menu-panel.open{display:flex}.menu-sheet{width:min(560px,100%);background:#fff;border-radius:22px;padding:10px;box-shadow:0 24px 70px rgba(0,0,0,.25)}.menu-handle{width:42px;height:4px;border-radius:999px;background:#d7dbe0;margin:4px auto 10px}.menu-item{width:100%;border:0;background:#fff;padding:15px 14px;border-radius:13px;text-align:left;font-size:15px;font-weight:800;cursor:pointer}.menu-item:hover{background:#f2f5f8}.menu-item.danger{color:var(--red)}.profile-add{width:100%;border:0;border-top:1px solid var(--line);background:#fff;padding:13px 12px;margin-top:4px;text-align:left;font-weight:850;color:var(--accent);cursor:pointer;border-radius:0 0 11px 11px}.profile-manage-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.profile-manage-row:last-child{border-bottom:0}.profile-manage-name{flex:1;font-weight:800}.mini-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-weight:750;cursor:pointer}.mini-btn.danger{color:var(--red)}.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.42);display:none;align-items:flex-end;justify-content:center;z-index:100;padding:12px}.modal-backdrop.open{display:flex}.settings-panel{width:min(560px,100%);background:#fff;border-radius:22px;padding:18px;box-shadow:0 24px 70px rgba(0,0,0,.25);max-height:85vh;overflow:auto}.settings-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}.settings-title{font-size:20px;font-weight:850}.close-btn{border:0;background:#f2f4f7;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer}.settings-section{padding:14px 0;border-top:1px solid var(--line)}.settings-section:first-of-type{border .tablebox{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.row{display:grid;grid-template-columns:70px 74px 110px minmax(180px,1fr) 78px 98px;align-items:center;min-height:48px;border-bottom:1px solid var(--line);padding:0 12px;gap:8px}.row:last-child{border-bottom:0}.head{background:var(--dark);color:#fff;min-height:42px;font-size:12px;font-weight:800}.stage{font-weight:650}.rank{font-weight:850}.pts{text-align:center;font-weight:800}.group{font-size:12px;color:var(--muted)}.head .group{color:#fff}.check{text-align:center}.doneRow{color:#8a9099}.doneRow .stage{text-decoration:line-through}.pill{display:inline-block;font-size:11px;padding:3px 7px;border-radius:999px;background:#eef2f6}

@media(max-width:700px){.wrap{padding:12px}.summary{grid-template-columns:1fr 1fr}.summary .card:last-child{grid-column:1/-1}.row{grid-template-columns:45px 50px minmax(130px,1fr) 56px 62px}.group{display:none}.head .group{display:none}.title{font-size:19px}.value{font-size:24px}.row{padding:0 8px;gap:5px}.stage{font-size:13px}}

<body>
<header><div class="wrap"><div class="top"><div><div class="title">実績チェッカー</div></div><button class="btn menu-btn" id="menuBtn" type="button">メニュー</button></div><div class="profile-switch"><button class="profile-current" id="profileCurrent" type="button"><div><div class="profile-main" id="profileName">メイン</div><div class="profile-meta" id="profileMeta">0 pt・達成率 0.00%</div></div><div class="profile-chevron">⌄</div></button><div class="profile-menu" id="profileMenu"></div></div></div></header>
<main class="wrap">
<section class="summary">
<div class="card"><div class="label">獲得点</div><div class="value" id="score">0 <small>pt</small></div></div>
<div class="card"><div class="label">満点</div><div class="value" id="maxScore">0 <small>pt</small></div></div>
<div class="card"><div class="label">達成率</div><div class="value" id="rate">0.00%</div></div>
</section>
<div class="tools">
<input class="search" id="search" placeholder="ステージ名を検索">
<select class="select" id="groupFilter"><option value="">すべてのグループ</option></select>
<select class="select" id="statusFilter"><option value="">すべて</option><option value="open">未完了</option><option value="done">完了</option></select>
</div>
<div class="tablebox"><div class="row head"><div>ランク</div><div class="pts">点数</div><div class="group">グループ</div><div>ステージ名</div><div class="check">完了</div><div class="check">アイテム</div></div><div id="list"></div></div>
</main>
<div class="menu-panel" id="mainMenu"><div class="menu-sheet"><div class="menu-handle"></div><button class="menu-item" id="openSettings" type="button">設定</button><button class="menu-item" id="openData" type="button">データ管理</button><button class="menu-item" id="openAbout" type="button">このサイトについて</button></div></div>
<div class="modal-backdrop" id="settingsModal"><div class="settings-panel" role="dialog" aria-modal="true"><div class="settings-head"><div class="settings-title">設定</div><button class="close-btn" data-close="settingsModal" type="button">×</button></div><div class="settings-section"><div class="settings-label">プロフィール管理</div><div class="settings-note">プロフィール名の変更や削除ができます。</div><div id="profileManage"></div></div></div></div>
<div class="modal-backdrop" id="dataModal"><div class="settings-panel" role="dialog" aria-modal="true"><div class="settings-head"><div class="settings-title">データ管理</div><button class="close-btn" data-close="dataModal" type="button">×</button></div><div class="settings-section"><div class="settings-label">バックアップ</div><div class="settings-note">必要なときにデータを書き出したり、以前のバックアップから復元できます。</div><div class="settings-actions"><button class="btn" id="exportBtn">バックアップを保存</button><label class="btn">バックアップから復元<input type="file" id="importFile" accept=".json" hidden></label></div></div><div class="settings-section"><div class="settings-label">現在のプロフィール</div><div class="settings-note">選択中のプロフィールの実績チェックをすべて未完了に戻します。</div><div class="settings-actions"><button class="btn danger" id="resetBtn">プロフィールをリセット</button></div></div></div></div>
<div class="modal-backdrop" id="aboutModal"><div class="settings-panel" role="dialog" aria-modal="true"><div class="settings-head"><div class="settings-title">このサイトについて</div><button class="close-btn" data-close="aboutModal" type="button">×</button></div><div class="settings-section"><div class="settings-label">実績チェッカー</div><div class="settings-note">実績の獲得ポイントを管理するサイトです。</div></div></div></div>

function emptyProgress(){return STAGES.map(()=>({done:false,item:false}))}
function blank(){return {profiles:["メイン","サブ","サブ2","サブ3"].map(name=>({name,progress:emptyProgress()}))}}
function normalize(x){
 if(!x?.profiles?.length)return null;
 if(Array.isArray(x.profiles[0])) return {profiles:x.profiles.map((progress,i)=>({name:["メイン","サブ","サブ2","サブ3"][i]||`プロフィール${i+1}`,progress}))};
 const profiles=x.profiles.map((p,i)=>({name:String(p?.name||`プロフィール${i+1}`).slice(0,30),progress:Array.isArray(p?.progress)?p.progress:emptyProgress()}));
 const stageInsertIndex=STAGES.findIndex(s=>s.name==='狩人の地図Ⅳ EX');
 profiles.forEach(p=>{
   if(p.progress.length===STAGES.length-1 && stageInsertIndex>=0)p.progress.splice(stageInsertIndex,0,{done:false,item:false});
   while(p.progress.length<STAGES.length)p.progress.push({done:false,item:false});
   p.progress=p.progress.slice(0,STAGES.length)
 });
 return profiles.length?{profiles}:null;

function load(){try{let raw=localStorage.getItem(key);if(!raw)raw=localStorage.getItem(oldKey);const n=normalize(JSON.parse(raw));if(n)return n}catch(e){}return blank()}

function save(){localStorage.setItem(key,JSON.stringify(state))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function crown(s){const m=s.name.match(/^(.*)冠([123])$/);return m?{g:m[1],n:+m[2]}:null}
function displayPoints(i,p){const s=STAGES[i],c=crown(s);if(c){const higher=STAGES.some((x,j)=>{const d=crown(x);return d&&d.g===c.g&&d.n>c.n&&p[j].done});return higher?0:s.base}const hasCrown=STAGES.some(x=>{const d=crown(x);return d&&d.g===s.name});if(hasCrown){const anyDone=STAGES.some((x,j)=>{const d=crown(x);return d&&d.g===s.name&&p[j].done});return anyDone?0:s.base}return s.base}
function isRateTarget(i){const s=STAGES[i],c=crown(s);if(c)return !STAGES.some(x=>{const d=crown(x);return d&&d.g===c.g&&d.n>c.n});return !STAGES.some(x=>{const d=crown(x);return d&&d.g===s.name})}
function calcFor(idx){const p=state.profiles[idx].progress;let score=0,max=0,targets=0,doneTargets=0;STAGES.forEach((s,i)=>{const dp=displayPoints(i,p);if(p[i].done)score+=Math.max(0,dp-(p[i].item?Math.min(3,dp):0));if(isRateTarget(i)){max+=s.base;targets++;if(p[i].done)doneTargets++}});return {score,max,rate:targets?doneTargets/targets:0}}
function renderProfileSwitch(){
 const c=calcFor(active),cur=state.profiles[active];
 profileName.textContent=cur.name;
 profileMeta.textContent=`${c.score} pt・達成率 ${(c.rate*100).toFixed(2)}%`;
 profileMenu.innerHTML=state.profiles.map((x,i)=>{const d=calcFor(i);return `<button class="profile-option ${i===active?'active':''}" data-i="${i}" type="button"><div><div class="profile-option-name">${esc(x.name)}</div><div class="profile-option-meta">${d.score} pt・達成率 ${(d.rate*100).toFixed(2)}%</div></div><div class="profile-check">${i===active?'✓':''}</div></button>`}).join("")+`<button class="profile-add" id="quickAddProfile" type="button">＋ プロフィールを追加</button>`;
 setupProfileLongPress();
 quickAddProfile.onclick=addProfile;
}
function setupProfileLongPress(){
 let timer=null,dragIndex=-1,dragging=false,moved=false,draggedEl=null;
 const options=[...profileMenu.querySelectorAll('.profile-option')];
 const clearTimer=()=>{if(timer){clearTimeout(timer);timer=null}};
 const updateIndices=()=>{[...profileMenu.querySelectorAll('.profile-option')].forEach((el,i)=>el.dataset.i=i)};
 const finishDrag=()=>{
   clearTimer();
   if(draggedEl)draggedEl.classList.remove('dragging');
   if(dragging){save();renderProfileSwitch();}
   dragging=false;dragIndex=-1;draggedEl=null;moved=false;
 };
 options.forEach(b=>{
   b.classList.add('long-press-ready');
   b.addEventListener('pointerdown',e=>{
     if(e.pointerType==='mouse'&&e.button!==0)return;
     moved=false;dragIndex=+b.dataset.i;draggedEl=b;clearTimer();
     timer=setTimeout(()=>{
       dragging=true;
       b.classList.add('dragging');
       if(navigator.vibrate)navigator.vibrate(30);
     },450);
   });
   b.addEventListener('pointermove',e=>{
     if(!dragging){if(Math.abs(e.movementY)>6){moved=true;clearTimer();}return;}
     e.preventDefault();
     const current=[...profileMenu.querySelectorAll('.profile-option')].indexOf(draggedEl);
     if(current<0)return;
     const els=[...profileMenu.querySelectorAll('.profile-option')].filter(el=>el!==draggedEl);
     let targetEl=null;
     for(const el of els){const r=el.getBoundingClientRect();if(e.clientY>=r.top&&e.clientY<=r.bottom){targetEl=el;break;}}
     if(!targetEl)return;
     const target=[...profileMenu.querySelectorAll('.profile-option')].indexOf(targetEl);
     if(target===current)return;
     const item=state.profiles.splice(current,1)[0];
     state.profiles.splice(target,0,item);
     if(active===current)active=target;
     else if(current<active&&active<=target)active--;
     else if(current>active&&active>=target)active++;
     if(target>current)profileMenu.insertBefore(draggedEl,targetEl.nextSibling);
     else profileMenu.insertBefore(draggedEl,targetEl);
     updateIndices();
   },{passive:false});
   b.addEventListener('pointerup',()=>{
     if(!dragging&&!moved){clearTimer();active=+b.dataset.i;profileMenu.classList.remove('open');profileCurrent.classList.remove('open');render();}
     else finishDrag();
   });
   b.addEventListener('pointercancel',finishDrag);
   b.addEventListener('pointerleave',()=>{if(!dragging)clearTimer();});
 });
}

function render(){renderProfileSwitch();const c=calcFor(active);score.innerHTML=`${c.score} <small>pt</small>`;maxScore.innerHTML=`${c.max} <small>pt</small>`;rate.textContent=(c.rate*100).toFixed(2)+"%";const q=search.value.trim().toLowerCase(),g=groupFilter.value,st=statusFilter.value,p=state.profiles[active].progress;let out="";STAGES.forEach((s,i)=>{if(q&&!s.name.toLowerCase().includes(q))return;if(g&&s.group!==g)return;if(st==="done"&&!p[i].done)return;if(st==="open"&&p[i].done)return;const dp=displayPoints(i,p);out+=`<div class="row ${p[i].done?'doneRow':''}"><div class="rank">${s.rank}</div><div class="pts">${dp}</div><div class="group"><span class="pill">${s.group}</span></div><div class="stage">${s.name}</div><div class="check"><input type="checkbox" data-i="${i}" data-k="done" ${p[i].done?'checked':''}></div><div class="check"><input type="checkbox" data-i="${i}" data-k="item" ${p[i].item?'checked':''} ${!p[i].done?'disabled':''}></div></div>`});list.innerHTML=out||`<div class="empty">該当する実績がありません</div>`;list.querySelectorAll('input').forEach(el=>el.onchange=()=>{const i=+el.dataset.i,k=el.dataset.k;p[i][k]=el.checked;if(k==='done'&&!el.checked)p[i].item=false;save();render()})}
function addProfile(){const name=prompt('新しいプロフィール名を入力してください','新しいプロフィール');if(name===null)return;const n=name.trim();if(!n)return alert('プロフィール名を入力してください');state.profiles.push({name:n.slice(0,30),progress:emptyProgress()});active=state.profiles.length-1;save();profileMenu.classList.remove('open');profileCurrent.classList.remove('open');render();renderProfileManage()}
function renderProfileManage(){profileManage.innerHTML=state.profiles.map((p,i)=>`<div class="profile-manage-row"><div class="profile-manage-name">${esc(p.name)}${i===active?' <span class="pill">使用中</span>':''}</div><button class="mini-btn" data-rename="${i}">名前変更</button><button class="mini-btn danger" data-delete="${i}" ${state.profiles.length===1?'disabled':''}>削除</button></div>`).join('');profileManage.querySelectorAll('[data-rename]').forEach(b=>b.onclick=()=>{const i=+b.dataset.rename,n=prompt('プロフィール名を変更',state.profiles[i].name);if(n===null)return;const v=n.trim();if(!v)return alert('プロフィール名を入力してください');state.profiles[i].name=v.slice(0,30);save();render();renderProfileManage()});profileManage.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{const i=+b.dataset.delete;if(state.profiles.length===1)return;if(!confirm(`「${state.profiles[i].name}」を削除しますか？\nこのプロフィールの実績データも削除されます。`))return;state.profiles.splice(i,1);if(active===i)active=Math.min(i,state.profiles.length-1);else if(active>i)active--;save();render();renderProfileManage()})}
[...new Set(STAGES.map(x=>x.group))].forEach(g=>groupFilter.insertAdjacentHTML('beforeend',`<option>${g}</option>`));
profileCurrent.onclick=()=>{profileMenu.classList.toggle('open');profileCurrent.classList.toggle('open')};document.addEventListener('click',e=>{if(!e.target.closest('.profile-switch')){profileMenu.classList.remove('open');profileCurrent.classList.remove('open')}});search.oninput=render;groupFilter.onchange=render;statusFilter.onchange=render;
menuBtn.onclick=()=>mainMenu.classList.add('open');mainMenu.onclick=e=>{if(e.target===mainMenu)mainMenu.classList.remove('open')};
function openModal(id){mainMenu.classList.remove('open');document.getElementById(id).classList.add('open')}
openSettings.onclick=()=>{renderProfileManage();openModal('settingsModal')};openData.onclick=()=>openModal('dataModal');openAbout.onclick=()=>openModal('aboutModal');document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.close).classList.remove('open'));document.querySelectorAll('.modal-backdrop').forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.remove('open')});
resetBtn.onclick=()=>{const n=state.profiles[active].name;if(confirm(`${n}のチェックをすべてリセットしますか？`)){state.profiles[active].progress=emptyProgress();save();render()}};
exportBtn.onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='実績チェッカー_バックアップ.json';a.click();URL.revokeObjectURL(a.href)};
importFile.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const n=normalize(JSON.parse(r.result));if(!n)throw 0;state=n;active=0;save();render();alert('読み込みました')}catch(_){alert('このサイト用のデータではありません')}};r.readAsText(f);e.target.value=''};
render();</script>
</body></html>
